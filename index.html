    <script>

const correctUsername = "ABBAS";
const correctPassword = "abbas28";

const loginPage = document.getElementById("loginPage");
const appPage = document.getElementById("appPage");
const loginForm = document.getElementById("loginForm");
const errorMessage = document.getElementById("errorMessage");

loginForm.addEventListener("submit", function (event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (
        username === correctUsername &&
        password === correctPassword
    ) {
        errorMessage.textContent = "";

        loginPage.hidden = true;
        appPage.hidden = false;

        showPage("home");
    } else {
        errorMessage.textContent =
            "Incorrect username and password";

        document.getElementById("password").value = "";
    }
});

function showPage(pageName) {
    document.getElementById("homeSection").classList.toggle(
        "active",
        pageName === "home"
    );

    document.getElementById("meSection").classList.toggle(
        "active",
        pageName === "me"
    );

    document.getElementById("homeButton").classList.toggle(
        "selected",
        pageName === "home"
    );

    document.getElementById("meButton").classList.toggle(
        "selected",
        pageName === "me"
    );
}

document.getElementById("homeButton").addEventListener("click", function () {
    showPage("home");
});

document.getElementById("meButton").addEventListener("click", function () {
    showPage("me");
});



function copyText() {
    // Text irukkura element-ah select panrom
    const textElement = document.getElementById("myText");
    const textToCopy = textElement.innerText;
    const statusElement = document.getElementById("status");

    // Modern Clipboard API use panrom
    navigator.clipboard.writeText(textToCopy).then(() => {
        statusElement.innerText = " copyed !";
        
        // 2 seconds ku appuram message-ah remove panlaam
        setTimeout(() => {
            statusElement.innerText = "";
        }, 2500);
    }).catch(err => {
        console.error('Copy panna mudiyala: ', err);
        statusElement.innerText = "Copy ERROR .";
        statusElement.style.color = "red";
    });
}
